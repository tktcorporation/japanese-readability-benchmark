name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      # API キーなしでパイプライン全体が通ることを確認する
      - run: pnpm demo
      - uses: actions/upload-artifact@v4
        with:
          name: demo-report
          path: results/runs/demo/report.md
