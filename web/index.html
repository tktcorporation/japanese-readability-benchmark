<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>どちらが読みやすい？ 日本語文章の比較評価</title>
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <header class="top">
    <h1>どちらが読みやすいですか？</h1>
    <p class="hint">
      同じ課題に対する 2 つの文章です。<strong>内容の正しさではなく、日本語として読みやすく分かりやすいか</strong>で選んでください。
      差を感じなければ「同じくらい」で構いません。
    </p>
    <div class="progress"><span id="progress-text">読み込み中…</span><div class="bar"><div id="progress-bar"></div></div></div>
  </header>

  <main id="main" hidden>
    <section class="task">
      <div><span class="label">課題</span> <span id="task-title"></span></div>
      <div><span class="label">想定読者</span> <span id="task-audience"></span></div>
    </section>

    <section class="columns">
      <article class="doc">
        <h2>文章 1</h2>
        <div class="text" id="text-left"></div>
      </article>
      <article class="doc">
        <h2>文章 2</h2>
        <div class="text" id="text-right"></div>
      </article>
    </section>

    <section class="vote">
      <button class="choice" data-choice="left">文章 1 が読みやすい</button>
      <button class="choice tie" data-choice="tie">同じくらい</button>
      <button class="choice" data-choice="right">文章 2 が読みやすい</button>
    </section>
    <section class="comment">
      <input id="comment" type="text" maxlength="500" placeholder="理由があれば一言（任意）" />
    </section>
  </main>

  <section id="done" hidden>
    <h2>ご協力ありがとうございました</h2>
    <p>用意していたペアはすべて回答済みです。<span id="done-count"></span></p>
  </section>

  <footer>
    <span>評価者 ID: <code id="rater-id"></code></span>
    <button id="reset" class="link">ID を作り直す</button>
  </footer>

  <script src="/app.js"></script>
</body>
</html>
