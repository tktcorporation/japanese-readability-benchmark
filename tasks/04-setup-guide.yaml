id: setup-guide
category: howto
title: 開発環境のセットアップ手順を書く
audience: 初めてこのリポジトリを触る開発者
tags: [howto, technical]
prompt: |
  Node.js プロジェクトの開発環境セットアップ手順を、初めてリポジトリを触る開発者向けに書いてください。
  手順に含めること:
  1. Node.js 22 以上と pnpm をインストールする（バージョン確認コマンドも示す）
  2. リポジトリをクローンして依存関係をインストールする
  3. .env.example をコピーして .env を作り、API キーを設定する
  4. テストを実行して環境が正しいことを確認する
  5. よくあるエラー（pnpm が見つからない、ポート 3000 が使用中）とその対処
  Markdown で、500〜800 文字程度の日本語で書いてください。
