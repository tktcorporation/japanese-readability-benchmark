id: faq-answer
category: support
title: サポート FAQ の回答を書く
audience: IT に詳しくない一般ユーザー
tags: [support, howto]
prompt: |
  IT にあまり詳しくない一般ユーザー向けに、次の FAQ の回答を書いてください。

  質問: 「パスワードを忘れてログインできません。どうすればいいですか？」

  回答に含めること:
  - ログイン画面の「パスワードをお忘れですか？」リンクから再設定メールを送れる
  - メールが届かない場合は、迷惑メールフォルダの確認と、登録メールアドレスの入力間違いを疑う
  - 再設定リンクの有効期限は 30 分
  - それでも解決しないときはサポート窓口（support@example.com）に、登録メールアドレスと発生日時を添えて連絡する
  300〜500 文字程度の日本語で、専門用語を使わずに書いてください。
