id: article-summary
category: summary
title: 社内向け記事を要約する
audience: 忙しい管理職。要点だけ短時間で把握したい
tags: [summary]
prompt: |
  次の社内記事を、忙しい管理職向けに 200〜300 文字で要約してください。結論と、判断に必要な数字を落とさないでください。

  ---
  今期、カスタマーサポート部門では問い合わせ対応の一次回答に AI アシスタントを試験導入した。対象は FAQ に該当する定型的な問い合わせで、全体の約 4 割を占める。
  試験期間の 3 か月で、一次回答までの平均時間は 6.2 時間から 1.1 時間に短縮した。顧客満足度（5 段階）は 3.9 から 4.1 に上がった。一方で、AI の回答をそのまま送ってしまい内容に誤りがあった事例が 7 件あり、うち 2 件は返金対応につながった。
  担当者からは「定型対応の負担が減り、複雑な案件に時間を使えるようになった」という声が多い一方、「AI の下書きを確認する作業が新たに増えた」という指摘もある。
  部門としては、確認手順を明文化したうえで、来期から全チームに展開したいと考えている。追加コストは月額約 30 万円で、削減できる人件費は月額約 90 万円と試算している。ただし、誤回答による信用低下のリスクをどう評価するかは、経営会議で判断を仰ぎたい。
  ---
