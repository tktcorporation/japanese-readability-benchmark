id: design-rationale
category: tech-explain
title: 設計判断の理由を説明する（ADR）
audience: 同じチームのエンジニア。背景は共有していない
tags: [technical, design]
prompt: |
  次の設計判断について、チームのエンジニア向けに短い ADR（Architecture Decision Record）を書いてください。
  - 決定: 通知配信を同期的な API 呼び出しから、メッセージキュー経由の非同期処理に変更する
  - 背景: 通知先サービスの遅延が API の応答時間に直結し、ピーク時にタイムアウトが増えていた
  - 検討した選択肢: (a) 現状維持でタイムアウトを延ばす、(b) キュー導入、(c) 通知先サービスを内製化
  - 決定理由: (b) は応答時間を通知先から切り離せ、再送も仕組みとして持てる。(c) は工数が大きすぎる
  - 影響: 通知は最大数秒遅れる。配信状態を確認する API を追加する必要がある
  見出し「背景」「決定」「理由」「影響」を使い、500〜800 文字程度の日本語で書いてください。
