id: apology-email
category: business
title: 納期遅延のお詫びメールを書く
audience: 取引先の担当者
tags: [business, email]
prompt: |
  取引先の担当者に送る、納品遅延のお詫びメールを書いてください。
  - 品目: Web サイトのリニューアル一式
  - 当初の納期: 9月10日 → 新しい納期: 9月17日
  - 理由: 追加でいただいた要望の反映に想定より時間がかかっている
  - 遅延中の対応: 完成している部分は先行して確認用環境で公開する
  件名、宛名、本文、結びを含め、300〜500 文字程度の日本語で書いてください。
  過剰にへりくだらず、状況と対応が明確に伝わる文面にしてください。
