id: release-notes
category: product
title: タスク管理アプリのリリースノートを書く
audience: アプリを日常的に使っている一般ユーザー
tags: [product, announcement]
prompt: |
  タスク管理アプリ「TodoLite」のバージョン 2.4 のリリースノートを書いてください。対象読者は一般ユーザーです。
  含める内容:
  - 新機能: タスクの繰り返し設定（毎日・毎週・毎月）、ダークモード
  - 改善: 同期の速度が約 2 倍に、検索でタグを指定できるように
  - 修正: 通知が二重に届くことがあった問題、日本語入力中に Enter でタスクが確定してしまう問題
  - 注意: Android 8 以下のサポートを終了
  400〜700 文字程度の日本語で書いてください。
