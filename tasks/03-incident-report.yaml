id: incident-report
category: business
title: サービス障害の報告文を書く
audience: サービスを利用している法人顧客の担当者
tags: [business, incident]
prompt: |
  次の障害について、法人顧客向けの障害報告文を書いてください。
  - 発生日時: 2026年8月28日 14:05〜15:40（JST）
  - 影響: 管理画面へのログインができない。API は正常
  - 原因: 認証サービスの設定変更で、セッション保存先の接続数上限を誤って下げてしまった
  - 対応: 設定を元に戻し、接続数の監視アラートを追加した
  - 再発防止: 設定変更時のレビュー手順に接続数の確認項目を追加する
  お詫び、概要、原因、対応、再発防止策の順で、500〜800 文字程度の日本語で書いてください。
